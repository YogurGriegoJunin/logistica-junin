<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yogur Griego Junín - V13</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
        #map { height: 180px; width: 100%; border-radius: 1.5rem; z-index: 1; }
        .content-scroll { height: calc(100vh - 70px); overflow-y: auto; padding-bottom: 100px; }
        /* Modal de pago */
        #payment-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="bg-slate-100">

    <div id="payment-modal">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4">
            <h3 class="font-black text-slate-800 uppercase text-sm">¿Cómo pagó el cliente?</h3>
            <p id="modal-client-name" class="text-xs text-blue-600 font-bold"></p>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="confirmDelivery('efectivo')" class="bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95">EFECTIVO 💵</button>
                <button onclick="confirmDelivery('transferencia')" class="bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg active:scale-95">TRANSFERENCIA 📱</button>
                <button onclick="closeModal()" class="text-slate-400 text-xs font-bold uppercase py-2">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
            <div>
                <h1 class="text-xs font-black uppercase tracking-tighter">Yogur Griego Junín</h1>
                <input type="date" id="view-date" onchange="renderAll()" class="bg-blue-800 text-white text-[11px] font-bold p-1 rounded mt-1 outline-none border-none">
            </div>
            <div class="flex gap-2">
                <button onclick="toggleSection('history-section')" class="bg-blue-600 p-2 rounded-lg shadow-inner">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <button onclick="toggleSection('summary-panel')" class="bg-blue-600 p-2 rounded-lg shadow-inner">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </button>
            </div>
        </header>

        <div class="content-scroll p-4 space-y-4">
            
            <div id="summary-panel" class="hidden bg-slate-900 text-white p-4 rounded-2xl shadow-xl space-y-3">
                <p class="text-[10px] font-bold text-center text-slate-400 uppercase">Caja del Día Seleccionado</p>
                <div class="grid grid-cols-2 gap-2 text-center">
                    <div class="bg-slate-800 p-2 rounded-xl"><p id="total-cash" class="text-green-400 font-black text-lg">$0</p><p class="text-[8px] uppercase opacity-50">Efectivo</p></div>
                    <div class="bg-slate-800 p-2 rounded-xl"><p id="total-transfer" class="text-blue-400 font-black text-lg">$0</p><p class="text-[8px] uppercase opacity-50">Transf.</p></div>
                </div>
                <div class="text-center pt-2 border-t border-slate-700">
                    <p id="total-general" class="text-2xl font-black">$0</p>
                </div>
            </div>

            <div id="history-section" class="hidden bg-white p-4 rounded-2xl shadow-md space-y-3 border border-blue-100">
                <h2 class="text-xs font-black text-blue-800 uppercase tracking-widest border-b pb-2">Historial de Ventas</h2>
                <div id="daily-history-list" class="space-y-2">
                    </div>
            </div>

            <div id="form-section" class="bg-white p-4 rounded-3xl shadow-sm space-y-3 border border-slate-200">
                <div class="flex gap-2">
                    <input type="date" id="input-date" class="w-1/3 bg-slate-50 p-3 rounded-xl text-xs font-bold outline-none border-2 border-transparent focus:border-blue-500">
                    <input type="text" id="address-input" placeholder="Calle y número" class="w-2/3 bg-slate-50 p-3 rounded-xl text-sm outline-none border-2 border-transparent focus:border-blue-500">
                </div>
                
                <div class="flex gap-2">
                    <input type="text" id="name-input" placeholder="Nombre cliente" class="w-1/2 bg-slate-50 p-3 rounded-xl text-sm outline-none">
                    <input type="tel" id="phone-input" placeholder="WhatsApp" class="w-1/2 bg-slate-50 p-3 rounded-xl text-sm outline-none">
                </div>

                <div class="grid grid-cols-3 gap-2 bg-blue-50 p-2 rounded-2xl">
                    <div class="text-center"><label class="block text-[8px] font-bold text-slate-400">YOGUR</label><input type="number" id="qty-yogur" value="0" class="w-full bg-transparent text-center font-bold"></div>
                    <div class="text-center border-x border-blue-100"><label class="block text-[8px] font-bold text-slate-400">GRANOLA</label><input type="number" id="qty-granola" value="0" class="w-full bg-transparent text-center font-bold"></div>
                    <div class="text-center"><label class="block text-[8px] font-bold text-blue-600">PRECIO $</label><input type="number" id="total-amount" placeholder="0" class="w-full bg-transparent text-center font-bold text-blue-600"></div>
                </div>

                <button id="btn-add" onclick="searchAndAdd()" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg active:bg-blue-900 transition-all">
                    GUARDAR PEDIDO
                </button>
            </div>

            <div id="map" class="shadow-md border-4 border-white"></div>

            <button onclick="openInGoogleMaps()" id="gps-button" class="hidden w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2">
                ABRIR RUTA COMPLETA GPS
            </button>

            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h2 class="font-black text-slate-800 text-[10px] uppercase">Pendientes de Entrega</h2>
                    <button onclick="optimizeRoute()" class="text-[9px] bg-green-600 text-white px-2 py-1 rounded font-bold uppercase">Optimizar Ruta</button>
                </div>
                <ul id="pending-list" class="space-y-3"></ul>
                
                <div id="completed-section" class="hidden pt-4 border-t border-slate-200">
                    <h2 class="font-bold text-slate-400 text-[10px] uppercase mb-2 text-center">Entregado hoy</h2>
                    <ul id="completed-list" class="space-y-2 opacity-70"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CITY_SUFFIX = ", Junín, Buenos Aires, Argentina";
        let map, originMarker, routeLine;
        let selectedOrderId = null; // Para saber qué pedido estamos entregando
        
        let stops = JSON.parse(localStorage.getItem('stops_v13')) || [];
        let completed = JSON.parse(localStorage.getItem('completed_v13')) || [];

        window.onload = function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('view-date').value = hoy;
            document.getElementById('input-date').value = hoy;

            map = L.map('map', { zoomControl: false }).setView([-34.585, -60.948], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            renderAll();
            renderHistory();
        };

        async function searchAndAdd() {
            const addr = document.getElementById('address-input').value;
            const date = document.getElementById('input-date').value;
            const btn = document.getElementById('btn-add');
            if (!addr) return alert("Pon una dirección");

            btn.disabled = true; btn.innerText = "BUSCANDO...";

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr + CITY_SUFFIX)}&limit=1`);
                const data = await res.json();
                if (data && data.length > 0) {
                    stops.push({
                        id: Date.now(),
                        latlng: { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) },
                        addr,
                        name: document.getElementById('name-input').value || 'S/N',
                        phone: document.getElementById('phone-input').value,
                        yogur: parseInt(document.getElementById('qty-yogur').value) || 0,
                        granola: parseInt(document.getElementById('qty-granola').value) || 0,
                        amount: parseFloat(document.getElementById('total-amount').value) || 0,
                        date
                    });
                    save(); renderAll(); resetInputs();
                } else { alert("No se encontró la dirección."); }
            } catch (e) { alert("Error de red"); }
            finally { btn.disabled = false; btn.innerText = "GUARDAR PEDIDO"; }
        }

        // --- LÓGICA DE ENTREGA Y MODAL ---
        function openDeliverModal(id) {
            selectedOrderId = id;
            const order = stops.find(s => s.id === id);
            document.getElementById('modal-client-name').innerText = order.name + " - $" + order.amount;
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('payment-modal').style.display = 'none';
            selectedOrderId = null;
        }

        function confirmDelivery(method) {
            const idx = stops.findIndex(s => s.id === selectedOrderId);
            if (idx !== -1) {
                let order = stops[idx];
                order.method = method; // Guardamos el método elegido al momento de entregar
                completed.push(order);
                stops.splice(idx, 1);
                save();
                renderAll();
                renderHistory();
                closeModal();
            }
        }

        function renderAll() {
            const currentDay = document.getElementById('view-date').value;
            if (routeLine) map.removeLayer(routeLine);
            map.eachLayer(l => { if(l instanceof L.Marker) map.removeLayer(l); });

            const visible = stops.filter(s => s.date === currentDay);
            const done = completed.filter(s => s.date === currentDay);

            visible.forEach(s => L.marker(s.latlng).addTo(map));

            const pList = document.getElementById('pending-list');
            const cList = document.getElementById('completed-list');
            pList.innerHTML = ''; cList.innerHTML = '';
            
            document.getElementById('completed-section').classList.toggle('hidden', done.length === 0);

            let cash = 0, trans = 0;

            visible.forEach(s => {
                const li = document.createElement('li');
                li.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center";
                li.innerHTML = `
                    <div class="overflow-hidden">
                        <p class="text-xs font-black text-blue-900 uppercase truncate">${s.name}</p>
                        <p class="text-[10px] text-slate-500 truncate">${s.addr}</p>
                        <p class="text-[10px] font-bold text-blue-600 mt-1">$${s.amount} • 🥛${s.yogur} 🌾${s.granola}</p>
                    </div>
                    <button onclick="openDeliverModal(${s.id})" class="bg-blue-600 text-white px-4 py-3 rounded-xl text-[10px] font-bold uppercase shadow-md active:bg-green-600">ENTREGAR</button>
                `;
                pList.appendChild(li);
            });

            done.forEach(s => {
                const li = document.createElement('li');
                li.className = "flex justify-between text-[10px] bg-white p-2 rounded-xl border border-slate-200 text-slate-400";
                li.innerHTML = `<span>${s.name} - $${s.amount} (${s.method === 'efectivo' ? 'Ef' : 'Tr'})</span> <span class="font-bold text-green-500">✓</span>`;
                cList.appendChild(li);
                if(s.method === 'efectivo') cash += s.amount; else trans += s.amount;
            });

            document.getElementById('total-cash').innerText = `$${cash}`;
            document.getElementById('total-transfer').innerText = `$${trans}`;
            document.getElementById('total-general').innerText = `Total Hoy: $${cash + trans}`;

            if (visible.length > 0) {
                document.getElementById('gps-button').classList.remove('hidden');
                const pts = visible.map(s => [s.latlng.lat, s.latlng.lng]);
                routeLine = L.polyline(pts, {color: '#1d4ed8', weight: 3, dashArray: '5, 10'}).addTo(map);
            } else { document.getElementById('gps-button').classList.add('hidden'); }
        }

        // --- LÓGICA DE HISTORIAL DE RESULTADOS DIARIOS ---
        function renderHistory() {
            const historyList = document.getElementById('daily-history-list');
            historyList.innerHTML = '';

            // Agrupamos los pedidos completados por fecha
            const totalsByDate = completed.reduce((acc, curr) => {
                if (!acc[curr.date]) acc[curr.date] = { total: 0, cash: 0, trans: 0 };
                acc[curr.date].total += curr.amount;
                if (curr.method === 'efectivo') acc[curr.date].cash += curr.amount;
                else acc[curr.date].trans += curr.amount;
                return acc;
            }, {});

            // Ordenamos por fecha (más reciente arriba)
            const sortedDates = Object.keys(totalsByDate).sort().reverse();

            if (sortedDates.length === 0) {
                historyList.innerHTML = '<p class="text-center text-[10px] text-slate-400">No hay ventas registradas aún.</p>';
                return;
            }

            sortedDates.forEach(date => {
                const data = totalsByDate[date];
                const item = document.createElement('div');
                item.className = "bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center";
                item.innerHTML = `
                    <div>
                        <p class="text-[10px] font-black text-slate-700">${date}</p>
                        <p class="text-[9px] text-slate-400">Ef: $${data.cash} | Tr: $${data.trans}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-black text-blue-700">$${data.total}</p>
                    </div>
                `;
                historyList.appendChild(item);
            });
        }

        function save() {
            localStorage.setItem('stops_v13', JSON.stringify(stops));
            localStorage.setItem('completed_v13', JSON.stringify(completed));
        }

        function resetInputs() {
            document.getElementById('address-input').value = '';
            document.getElementById('name-input').value = '';
            document.getElementById('phone-input').value = '';
            document.getElementById('qty-yogur').value = 0;
            document.getElementById('qty-granola').value = 0;
            document.getElementById('total-amount').value = '';
        }

        function toggleSection(id) {
            document.getElementById(id).classList.toggle('hidden');
        }

        function openInGoogleMaps() {
            const d = document.getElementById('view-date').value;
            const vs = stops.filter(s => s.date === d);
            if(vs.length === 0) return;
            const dest = `${vs[vs.length - 1].latlng.lat},${vs[vs.length - 1].latlng.lng}`;
            const waypoints = vs.slice(0, -1).map(s => `${s.latlng.lat},${s.latlng.lng}`).join('|');
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&waypoints=${encodeURIComponent(waypoints)}&travelmode=driving`, '_blank');
        }

        function optimizeRoute() {
            const d = document.getElementById('view-date').value;
            let dayStops = stops.filter(s => s.date === d);
            let otherStops = stops.filter(s => s.date !== d);
            if (dayStops.length < 2) return;
            
            let ordered = [];
            let current = { lat: -34.585, lng: -60.948 }; // Centro de Junín como inicio por defecto
            
            while(dayStops.length > 0) {
                let nearIdx = 0; let minDist = Infinity;
                dayStops.forEach((s, i) => {
                    const dist = Math.hypot(current.lat - s.latlng.lat, current.lng - s.latlng.lng);
                    if(dist < minDist) { minDist = dist; nearIdx = i; }
                });
                ordered.push(dayStops[nearIdx]);
                current = dayStops[nearIdx].latlng;
                dayStops.splice(nearIdx, 1);
            }
            stops = [...ordered, ...otherStops];
            save(); renderAll();
        }
    </script>
</body>
</html>
