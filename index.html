<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yogur Griego Junín - Dashboard</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2921/2921820.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
        #map { height: 25vh; width: 100%; border-radius: 1.25rem; z-index: 1; }
        .app-container { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="app-container">
        <header class="bg-blue-700 text-white p-4 pt-6 shadow-lg shrink-0">
            <div class="max-w-xl mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-bold">Yogur Griego Junín</h1>
                    <p class="text-[9px] opacity-80 uppercase tracking-widest font-bold">Logística e Inventario</p>
                </div>
                <button onclick="toggleSummary()" class="bg-blue-500 p-2 rounded-lg shadow-inner active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                </button>
            </div>
        </header>

        <div class="content-scroll">
            <div class="max-w-xl mx-auto p-4 space-y-4 pb-28">
                
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                    <div class="grid grid-cols-1 gap-2">
                        <input type="text" id="address-input" list="client-suggestions" placeholder="Dirección del cliente" 
                               class="w-full px-4 py-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"
                               oninput="checkDirectory(this.value)">
                        <datalist id="client-suggestions"></datalist>
                        
                        <div class="flex gap-2">
                            <input type="text" id="name-input" placeholder="Nombre" class="w-1/2 px-4 py-3 bg-slate-100 rounded-xl text-sm outline-none">
                            <input type="tel" id="phone-input" placeholder="WhatsApp" class="w-1/2 px-4 py-3 bg-slate-100 rounded-xl text-sm outline-none">
                        </div>

                        <div class="flex gap-2 bg-blue-50 p-2 rounded-xl">
                            <div class="flex-1">
                                <label class="text-[9px] font-bold text-blue-700 px-2 uppercase">Yogures</label>
                                <input type="number" id="qty-yogur" value="0" class="w-full bg-transparent px-2 font-bold text-blue-900 outline-none">
                            </div>
                            <div class="flex-1 border-l border-blue-200">
                                <label class="text-[9px] font-bold text-blue-700 px-2 uppercase">Granolas</label>
                                <input type="number" id="qty-granola" value="0" class="w-full bg-transparent px-2 font-bold text-blue-900 outline-none">
                            </div>
                        </div>

                        <textarea id="notes-input" placeholder="Notas (ej: dejar en la reja)" class="w-full px-4 py-2 bg-slate-100 rounded-xl text-xs outline-none h-16"></textarea>
                    </div>

                    <button onclick="searchAndAdd()" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform">
                        AGREGAR A LA RUTA
                    </button>
                    
                    <div class="flex gap-2">
                        <button onclick="setSearchAsOrigin()" class="flex-1 bg-slate-100 text-slate-500 py-2 rounded-lg text-[10px] font-bold uppercase">Inicio</button>
                        <button onclick="optimizeRoute()" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-[10px] font-bold uppercase shadow-md">Optimizar</button>
                    </div>
                </div>

                <div id="summary-panel" class="hidden bg-slate-900 text-white p-5 rounded-3xl animate-fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-sm uppercase tracking-widest">Resumen de Carga</h3>
                        <button onclick="toggleSummary()" class="text-slate-400">✕</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700">
                            <p id="total-yogur" class="text-2xl font-black text-blue-400">0</p>
                            <p class="text-[10px] opacity-60 uppercase font-bold">Yogures</p>
                        </div>
                        <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700">
                            <p id="total-granola" class="text-2xl font-black text-green-400">0</p>
                            <p class="text-[10px] opacity-60 uppercase font-bold">Granolas</p>
                        </div>
                    </div>
                </div>

                <div id="map" class="shadow-md border-4 border-white"></div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center px-2">
                        <h2 class="font-bold text-slate-800 text-sm uppercase tracking-tighter">Entregas Pendientes (<span id="count-pending">0</span>)</h2>
                        <button onclick="clearEverything()" class="text-[10px] text-red-500 font-bold uppercase">Reiniciar Día</button>
                    </div>
                    <ul id="pending-list" class="space-y-3"></ul>
                </div>

                <div id="completed-section" class="hidden space-y-3 pt-4 border-t border-slate-200">
                    <h2 class="font-bold text-slate-400 text-sm uppercase tracking-tighter px-2">Entregado Hoy</h2>
                    <ul id="completed-list" class="space-y-2 opacity-60"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CITY_SUFFIX = ", Junín, Buenos Aires, Argentina";
        let map, originMarker, routeLine, origin;
        let stops = JSON.parse(localStorage.getItem('stops_v3')) || [];
        let completed = JSON.parse(localStorage.getItem('completed_v3')) || [];
        let directory = JSON.parse(localStorage.getItem('directory_v3')) || {};

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([-34.585, -60.948], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            updateDirectoryUI();
            loadOrigin();
            renderAll();
        }

        function checkDirectory(addr) {
            if (directory[addr]) {
                document.getElementById('name-input').value = directory[addr].name || "";
                document.getElementById('phone-input').value = directory[addr].phone || "";
                document.getElementById('notes-input').value = directory[addr].notes || "";
            }
        }

        function updateDirectoryUI() {
            const dl = document.getElementById('client-suggestions');
            dl.innerHTML = '';
            Object.keys(directory).forEach(a => {
                const o = document.createElement('option');
                o.value = a;
                dl.appendChild(o);
            });
        }

        async function searchAndAdd(asOrigin = false) {
            const addr = document.getElementById('address-input').value;
            const name = document.getElementById('name-input').value;
            const phone = document.getElementById('phone-input').value;
            const y = parseInt(document.getElementById('qty-yogur').value) || 0;
            const g = parseInt(document.getElementById('qty-granola').value) || 0;
            const notes = document.getElementById('notes-input').value;

            if (!addr) return;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr + CITY_SUFFIX)}&limit=1`);
                const data = await res.json();
                if (data[0]) {
                    const latlng = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    if (asOrigin) {
                        origin = latlng;
                        localStorage.setItem('origin_v3', JSON.stringify(origin));
                        renderAll();
                    } else {
                        // Guardar en agenda
                        directory[addr] = { name: name, phone: phone, notes: notes };
                        localStorage.setItem('directory_v3', JSON.stringify(directory));
                        
                        stops.push({ id: Date.now(), latlng: latlng, addr: addr, name: name, phone: phone, yogur: y, granola: g, notes: notes });
                        saveStops();
                        renderAll();
                    }
                    resetInputs();
                }
            } catch (e) { alert("Error al buscar dirección"); }
        }

        function renderAll() {
            // Limpiar Mapa
            if (originMarker) map.removeLayer(originMarker);
            if (routeLine) map.removeLayer(routeLine);
            map.eachLayer(l => { if(l instanceof L.Marker) map.removeLayer(l); });

            // Dibujar Origen
            if (origin) {
                const icon = L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', iconSize: [25, 41], iconAnchor: [12, 41] });
                originMarker = L.marker(origin, {icon: icon}).addTo(map);
            }

            // Dibujar Pendientes
            stops.forEach(s => { L.marker(s.latlng).addTo(map); });

            updateListsUI();
            updateSummary();
        }

        function updateListsUI() {
            const pList = document.getElementById('pending-list');
            const cList = document.getElementById('completed-list');
            pList.innerHTML = ''; cList.innerHTML = '';

            document.getElementById('count-pending').innerText = stops.length;
            document.getElementById('completed-section').classList.toggle('hidden', completed.length === 0);

            stops.forEach((s, i) => {
                const li = document.createElement('li');
                li.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 animate-fade-in";
                li.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-xs font-black uppercase text-blue-700">${s.name || 'Cliente'}</p>
                            <p class="text-[10px] text-slate-500">${s.addr}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="sendWhatsApp('${s.phone}', '${s.name}', '${s.addr}')" class="p-2 bg-green-100 text-green-700 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            </button>
                            <button onclick="deliver(${s.id})" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-[10px] font-bold">ENTREGAR</button>
                        </div>
                    </div>
                    <div class="flex gap-3 text-[10px] font-bold">
                        <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded">🥛 ${s.yogur}</span>
                        <span class="bg-green-50 text-green-700 px-2 py-1 rounded">🌾 ${s.granola}</span>
                        ${s.notes ? `<span class="bg-amber-50 text-amber-700 px-2 py-1 rounded italic">📝 ${s.notes}</span>` : ''}
                    </div>
                `;
                pList.appendChild(li);
            });

            completed.forEach(s => {
                const li = document.createElement('li');
                li.className = "bg-slate-200 p-2 rounded-xl flex justify-between items-center text-[10px]";
                li.innerHTML = `<span>${s.name} - ${s.addr}</span> <span class="font-bold">✓</span>`;
                cList.appendChild(li);
            });
        }

        function deliver(id) {
            const idx = stops.findIndex(s => s.id === id);
            completed.push(stops[idx]);
            stops.splice(idx, 1);
            saveStops();
            renderAll();
        }

        function updateSummary() {
            let ty = 0, tg = 0;
            stops.forEach(s => { ty += s.yogur; tg += s.granola; });
            document.getElementById('total-yogur').innerText = ty;
            document.getElementById('total-granola').innerText = tg;
        }

        function sendWhatsApp(phone, name, addr) {
            const msg = `¡Hola ${name}! Soy Claudio de Yogur Griego Junín. Te aviso que estoy saliendo para tu domicilio en ${addr}. Llego en unos minutos.`;
            const clean = phone.replace(/\D/g, '');
            const final = clean.length <= 10 ? '549' + clean : clean;
            window.open(`https://wa.me/${final}?text=${encodeURIComponent(msg)}`);
        }

        function optimizeRoute() {
            if(!origin || stops.length < 2) return;
            let unvisited = [...stops], ordered = [], current = origin;
            while(unvisited.length > 0) {
                let nearIdx = 0, minDist = Infinity;
                unvisited.forEach((s, i) => {
                    const d = Math.hypot(current.lat - s.latlng.lat, current.lng - s.latlng.lng);
                    if(d < minDist) { minDist = d; nearIdx = i; }
                });
                ordered.push(unvisited[nearIdx]);
                current = unvisited[nearIdx].latlng;
                unvisited.splice(nearIdx, 1);
            }
            stops = ordered;
            saveStops();
            renderAll();
            
            const pts = [[origin.lat, origin.lng], ...stops.map(s => [s.latlng.lat, s.latlng.lng])];
            routeLine = L.polyline(pts, {color: '#2563eb', weight: 3, dashArray: '5, 10'}).addTo(map);
            map.fitBounds(routeLine.getBounds(), {padding: [30,30]});
        }

        function openInGoogleMaps() {
            if(!origin || !stops.length) return;
            const dest = stops[stops.length-1].latlng;
            const waypoints = stops.slice(0, -1).map(s => `${s.latlng.lat},${s.latlng.lng}`).join('|');
            window.open(`https://www.google.com/maps/dir/?api=1&origin=${origin.lat},${origin.lng}&destination=${dest.lat},${dest.lng}&waypoints=${waypoints}&travelmode=driving`);
        }

        function toggleSummary() { document.getElementById('summary-panel').classList.toggle('hidden'); }
        function saveStops() { 
            localStorage.setItem('stops_v3', JSON.stringify(stops));
            localStorage.setItem('completed_v3', JSON.stringify(completed));
        }
        function resetInputs() {
            ['address-input','name-input','phone-input','notes-input'].forEach(i => document.getElementById(i).value = '');
            document.getElementById('qty-yogur').value = 0;
            document.getElementById('qty-granola').value = 0;
        }
        function clearEverything() {
            if(confirm("¿Borrar ruta y entregas del día? (La agenda de clientes se mantiene)")) {
                stops = []; completed = [];
                localStorage.removeItem('stops_v3'); localStorage.removeItem('completed_v3');
                renderAll();
            }
        }
        function loadOrigin() { origin = JSON.parse(localStorage.getItem('origin_v3')); }
        function setSearchAsOrigin() { searchAndAdd(true); }

        window.onload = initMap;
    </script>
</body>
</html>
