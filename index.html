<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística Yogur Junín - V16</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
        #map { height: 180px; width: 100%; border-radius: 1.5rem; z-index: 1; border: 3px solid white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .content-scroll { height: calc(100vh - 70px); overflow-y: auto; padding-bottom: 120px; }
        #payment-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="bg-slate-100">

    <div id="payment-modal">
        <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center space-y-4 shadow-2xl">
            <div class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-2">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            </div>
            <h3 class="font-black text-slate-800 uppercase text-sm">Registrar Pago</h3>
            <p id="modal-client-name" class="text-xs text-blue-600 font-bold"></p>
            <div class="grid grid-cols-1 gap-3">
                <button onclick="confirmDelivery('efectivo')" class="bg-green-600 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 text-sm uppercase">Efectivo 💵</button>
                <button onclick="confirmDelivery('transferencia')" class="bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg active:scale-95 text-sm uppercase">Transferencia 📱</button>
                <button onclick="closeModal()" class="text-slate-400 text-[10px] font-bold uppercase py-2">Volver atrás</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
            <div>
                <h1 class="text-[10px] font-black uppercase tracking-widest text-blue-200">Reparto Junín</h1>
                <input type="date" id="view-date" onchange="renderAll()" class="bg-blue-800 text-white text-xs font-bold p-1 rounded mt-1 outline-none border-none">
            </div>
            <div class="flex gap-2">
                <button onclick="toggleSection('history-section')" class="bg-blue-600 p-2.5 rounded-xl border border-blue-500 active:bg-blue-800">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <button onclick="toggleSection('summary-panel')" class="bg-blue-600 p-2.5 rounded-xl border border-blue-500 active:bg-blue-800">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </button>
            </div>
        </header>

        <div class="content-scroll p-4 space-y-4">
            
            <div id="summary-panel" class="hidden bg-slate-900 text-white p-5 rounded-3xl shadow-xl space-y-4 border border-slate-700">
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-slate-800 p-3 rounded-2xl">
                        <p id="total-cash" class="text-green-400 font-black text-xl">$0</p>
                        <p class="text-[9px] uppercase font-bold text-slate-500 tracking-tighter">Efectivo Total</p>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-2xl">
                        <p id="total-transfer" class="text-blue-400 font-black text-xl">$0</p>
                        <p class="text-[9px] uppercase font-bold text-slate-500 tracking-tighter">Transf. Total</p>
                    </div>
                </div>
                <div class="text-center pt-2 border-t border-slate-800">
                    <p id="total-general" class="text-3xl font-black text-white">$0</p>
                    <p class="text-[10px] uppercase text-blue-500 font-black mt-1 tracking-widest">Cierre de Caja</p>
                </div>
            </div>

            <div id="history-section" class="hidden bg-white p-5 rounded-3xl shadow-md space-y-4 border border-blue-100">
                <div class="flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <h2 class="text-[11px] font-black text-slate-800 uppercase">Historial de Ventas</h2>
                        <button onclick="exportToCSV()" class="bg-green-600 text-white text-[11px] px-4 py-2 rounded-xl font-black shadow-md uppercase">Excel Detallado</button>
                    </div>
                    <p class="text-[9px] text-slate-400 italic font-medium">El reporte Excel separa automáticamente Efectivo y Transferencia.</p>
                </div>
                <div id="daily-history-list" class="space-y-2 max-h-60 overflow-y-auto pt-2"></div>
            </div>

            <div class="bg-white p-5 rounded-[2rem] shadow-sm space-y-3 border border-slate-200" id="main-form">
                <div class="flex justify-between items-center mb-1">
                    <h2 id="form-title" class="text-[10px] font-black text-blue-800 uppercase tracking-widest italic">Cargar Nuevo Pedido</h2>
                </div>
                <input type="hidden" id="editing-id" value="">
                
                <input type="text" id="address-input" placeholder="Dirección (Calle y N°)" class="w-full bg-slate-50 p-4 rounded-2xl text-sm font-bold outline-none border-2 border-transparent focus:border-blue-500 placeholder:text-slate-300">
                
                <div class="flex gap-2">
                    <input type="text" id="name-input" placeholder="Nombre" class="w-1/2 bg-slate-50 p-4 rounded-2xl text-sm outline-none font-medium">
                    <input type="tel" id="phone-input" placeholder="WhatsApp" class="w-1/2 bg-slate-50 p-4 rounded-2xl text-sm outline-none font-medium">
                </div>

                <div class="grid grid-cols-3 gap-2 bg-blue-50/30 p-3 rounded-2xl border border-blue-50">
                    <div class="text-center"><label class="block text-[8px] font-black text-slate-400">YOGUR</label><input type="number" id="qty-yogur" value="0" class="w-full bg-transparent text-center font-black text-lg"></div>
                    <div class="text-center border-x border-slate-200"><label class="block text-[8px] font-black text-slate-400">GRANOLA</label><input type="number" id="qty-granola" value="0" class="w-full bg-transparent text-center font-black text-lg"></div>
                    <div class="text-center"><label class="block text-[8px] font-black text-blue-600">PRECIO $</label><input type="number" id="total-amount" placeholder="0" class="w-full bg-transparent text-center font-black text-lg text-blue-700"></div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button id="btn-cancel-edit" onclick="resetInputs()" class="hidden flex-1 bg-slate-200 text-slate-500 py-4 rounded-2xl font-black text-xs uppercase">X</button>
                    <button id="btn-add" onclick="searchAndAdd()" class="flex-[3] bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg text-sm uppercase tracking-widest">Guardar Pedido</button>
                </div>
            </div>

            <div id="map"></div>

            <button onclick="openInGoogleMaps()" id="gps-button" class="hidden w-full bg-slate-900 text-white py-5 rounded-[2rem] font-black flex items-center justify-center gap-3 shadow-2xl active:scale-95 transition-transform">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
                ABRIR MAPA DE RUTA
            </button>

            <div class="space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h2 class="font-black text-slate-800 text-[11px] uppercase tracking-tighter">Entregas Pendientes</h2>
                    <button onclick="optimizeRoute()" class="text-[10px] bg-white text-blue-700 px-4 py-2 rounded-xl font-black uppercase border-2 border-blue-700 shadow-sm">Optimizar Ruta</button>
                </div>
                <ul id="pending-list" class="space-y-4"></ul>
                
                <div id="completed-section" class="hidden pt-8 border-t-2 border-dashed border-slate-300">
                    <h2 class="font-black text-slate-400 text-[10px] uppercase mb-4 text-center tracking-[0.2em]">Caja Cerrada del Día</h2>
                    <ul id="completed-list" class="space-y-2 opacity-70"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CITY_SUFFIX = ", Junín, Buenos Aires, Argentina";
        let map, routeLine;
        let selectedOrderId = null;
        
        let stops = JSON.parse(localStorage.getItem('stops_v16')) || [];
        let completed = JSON.parse(localStorage.getItem('completed_v16')) || [];

        window.onload = function() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('view-date').value = hoy;
            map = L.map('map', { zoomControl: false }).setView([-34.585, -60.948], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            renderAll(); renderHistory();
        };

        async function searchAndAdd() {
            const addr = document.getElementById('address-input').value;
            const date = document.getElementById('view-date').value;
            const editId = document.getElementById('editing-id').value;
            const btn = document.getElementById('btn-add');

            if (!addr) return alert("Falta la dirección");
            btn.disabled = true; btn.innerText = "LOCALIZANDO...";

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr + CITY_SUFFIX)}&limit=1`);
                const data = await res.json();
                
                if (data && data.length > 0) {
                    const latlng = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    const orderData = {
                        id: editId ? parseInt(editId) : Date.now(),
                        latlng, addr,
                        name: document.getElementById('name-input').value || 'S/N',
                        phone: document.getElementById('phone-input').value || '',
                        yogur: parseInt(document.getElementById('qty-yogur').value) || 0,
                        granola: parseInt(document.getElementById('qty-granola').value) || 0,
                        amount: parseFloat(document.getElementById('total-amount').value) || 0,
                        date: date
                    };

                    if (editId) {
                        const idx = stops.findIndex(s => s.id === parseInt(editId));
                        stops[idx] = orderData;
                    } else { stops.push(orderData); }
                    
                    save(); renderAll(); resetInputs();
                } else { alert("No encontramos la dirección en Junín. Revisá la altura."); }
            } catch (e) { alert("Error de red. Verificá tu conexión."); }
            finally { btn.disabled = false; btn.innerText = "GUARDAR PEDIDO"; }
        }

        function editOrder(id) {
            const order = stops.find(s => s.id === id);
            if (!order) return;
            document.getElementById('editing-id').value = order.id;
            document.getElementById('address-input').value = order.addr;
            document.getElementById('name-input').value = order.name;
            document.getElementById('phone-input').value = order.phone;
            document.getElementById('qty-yogur').value = order.yogur;
            document.getElementById('qty-granola').value = order.granola;
            document.getElementById('total-amount').value = order.amount;
            document.getElementById('form-title').innerText = "Editando pedido cargado";
            document.getElementById('btn-add').innerText = "ACTUALIZAR";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            document.getElementById('main-form').scrollIntoView({behavior: "smooth"});
        }

        function deleteOrder(id) {
            if(confirm("¿Seguro que querés eliminar este pedido? No se puede deshacer.")) {
                stops = stops.filter(s => s.id !== id);
                save(); renderAll();
            }
        }

        function openDeliverModal(id) {
            selectedOrderId = id;
            const order = stops.find(s => s.id === id);
            document.getElementById('modal-client-name').innerText = order.name + " - $" + order.amount;
            document.getElementById('payment-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('payment-modal').style.display = 'none'; }

        function confirmDelivery(method) {
            const idx = stops.findIndex(s => s.id === selectedOrderId);
            if (idx !== -1) {
                let order = stops[idx];
                order.method = method;
                completed.push(order);
                stops.splice(idx, 1);
                save(); renderAll(); renderHistory(); closeModal();
            }
        }

        function renderAll() {
            const currentDay = document.getElementById('view-date').value;
            if (routeLine) map.removeLayer(routeLine);
            map.eachLayer(l => { if(l instanceof L.Marker) map.removeLayer(l); });

            const visible = stops.filter(s => s.date === currentDay);
            const done = completed.filter(s => s.date === currentDay);

            visible.forEach(s => L.marker(s.latlng).addTo(map));

            const pList = document.getElementById('pending-list');
            const cList = document.getElementById('completed-list');
            pList.innerHTML = ''; cList.innerHTML = '';
            
            document.getElementById('completed-section').classList.toggle('hidden', done.length === 0);

            let cash = 0, trans = 0;

            visible.forEach(s => {
                const li = document.createElement('li');
                li.className = "bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4";
                li.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="overflow-hidden">
                            <p class="text-xs font-black text-slate-800 uppercase truncate">${s.name}</p>
                            <p class="text-[10px] text-slate-500 truncate font-bold">${s.addr}</p>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editOrder(${s.id})" class="p-2 bg-blue-50 text-blue-600 rounded-xl">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 113 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button onclick="deleteOrder(${s.id})" class="p-2 bg-red-50 text-red-600 rounded-xl">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between gap-3 pt-3 border-t border-slate-50">
                        <span class="text-[11px] font-black text-blue-700 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-100">$${s.amount} • 🥛${s.yogur} 🌾${s.granola}</span>
                        <button onclick="openDeliverModal(${s.id})" class="bg-blue-700 text-white px-8 py-3 rounded-2xl text-[10px] font-black uppercase shadow-lg active:bg-green-600 transition-colors">Entregar</button>
                    </div>
                `;
                pList.appendChild(li);
            });

            done.forEach(s => {
                const li = document.createElement('li');
                li.className = "flex justify-between text-[10px] bg-white p-3 rounded-xl border border-slate-200 text-slate-400 font-bold mb-2";
                li.innerHTML = `<span>${s.name} - $${s.amount} (${s.method === 'efectivo' ? 'EF' : 'TR'})</span> <span class="text-green-500 font-black">ENTREGADO</span>`;
                cList.appendChild(li);
                if(s.method === 'efectivo') cash += s.amount; else trans += s.amount;
            });

            document.getElementById('total-cash').innerText = `$${cash}`;
            document.getElementById('total-transfer').innerText = `$${trans}`;
            document.getElementById('total-general').innerText = `$${cash + trans}`;

            if (visible.length > 0) {
                document.getElementById('gps-button').classList.remove('hidden');
                const pts = visible.map(s => [s.latlng.lat, s.latlng.lng]);
                routeLine = L.polyline(pts, {color: '#1d4ed8', weight: 3, dashArray: '8, 12'}).addTo(map);
            } else { document.getElementById('gps-button').classList.add('hidden'); }
        }

        function renderHistory() {
            const historyList = document.getElementById('daily-history-list');
            historyList.innerHTML = '';
            const totals = completed.reduce((acc, curr) => {
                if (!acc[curr.date]) acc[curr.date] = { total: 0, cash: 0, trans: 0 };
                acc[curr.date].total += curr.amount;
                if (curr.method === 'efectivo') acc[curr.date].cash += curr.amount;
                else acc[curr.date].trans += curr.amount;
                return acc;
            }, {});

            Object.keys(totals).sort().reverse().forEach(date => {
                const data = totals[date];
                const item = document.createElement('div');
                item.className = "bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm";
                item.innerHTML = `
                    <div><p class="text-[10px] font-black text-slate-800 uppercase tracking-tighter">${date}</p>
                    <p class="text-[9px] text-slate-500 font-bold">Ef: $${data.cash} | Tr: $${data.trans}</p></div>
                    <p class="text-base font-black text-blue-700">$${data.total}</p>
                `;
                historyList.appendChild(item);
            });
        }

        function exportToCSV() {
            if (completed.length === 0) return alert("No hay datos para exportar.");
            
            // BOM para que Excel detecte los acentos y símbolos correctamente
            let csv = "\uFEFF";
            csv += "Fecha,Cliente,Dirección,Yogur,Granola,Monto Efectivo,Monto Transferencia,Total Cobrado\n";
            
            completed.forEach(s => {
                const cashVal = s.method === 'efectivo' ? s.amount : 0;
                const transVal = s.method === 'transferencia' ? s.amount : 0;
                csv += `${s.date},${s.name},${s.addr.replace(',', '.')},${s.yogur},${s.granola},${cashVal},${transVal},${s.amount}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Ventas_Yogur_Junin_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function save() {
            localStorage.setItem('stops_v16', JSON.stringify(stops));
            localStorage.setItem('completed_v16', JSON.stringify(completed));
        }

        function resetInputs() {
            document.getElementById('editing-id').value = "";
            document.getElementById('address-input').value = "";
            document.getElementById('name-input').value = "";
            document.getElementById('phone-input').value = "";
            document.getElementById('qty-yogur').value = 0;
            document.getElementById('qty-granola').value = 0;
            document.getElementById('total-amount').value = "";
            document.getElementById('form-title').innerText = "Cargar Nuevo Pedido";
            document.getElementById('btn-add').innerText = "GUARDAR PEDIDO";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        function toggleSection(id) { document.getElementById(id).classList.toggle('hidden'); }

        function openInGoogleMaps() {
            const d = document.getElementById('view-date').value;
            const vs = stops.filter(s => s.date === d);
            if(vs.length === 0) return;
            const dest = `${vs[vs.length - 1].latlng.lat},${vs[vs.length - 1].latlng.lng}`;
            const waypoints = vs.slice(0, -1).map(s => `${s.latlng.lat},${s.latlng.lng}`).join('|');
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${dest}&waypoints=${encodeURIComponent(waypoints)}&travelmode=driving`, '_blank');
        }

        function optimizeRoute() {
            const d = document.getElementById('view-date').value;
            let dayStops = stops.filter(s => s.date === d);
            let otherStops = stops.filter(s => s.date !== d);
            if (dayStops.length < 2) return;
            let ordered = [], current = { lat: -34.585, lng: -60.948 };
            while(dayStops.length > 0) {
                let nearIdx = 0, minDist = Infinity;
                dayStops.forEach((s, i) => {
                    const dist = Math.hypot(current.lat - s.latlng.lat, current.lng - s.latlng.lng);
                    if(dist < minDist) { minDist = dist; nearIdx = i; }
                });
                ordered.push(dayStops[nearIdx]);
                current = dayStops[nearIdx].latlng;
                dayStops.splice(nearIdx, 1);
            }
            stops = [...ordered, ...otherStops];
            save(); renderAll();
        }
    </script>
</body>
</html>
