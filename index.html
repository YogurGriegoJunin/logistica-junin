<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logística - Yogur Griego Junín</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2921/2921820.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
        #map { height: 25vh; width: 100%; border-radius: 1.5rem; z-index: 1; }
        .app-container { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .content-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="app-container">
        <header class="bg-blue-700 text-white p-4 pt-6 shadow-lg shrink-0">
            <div class="max-w-xl mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-lg font-bold">Hoja de Ruta</h1>
                    <div class="flex items-center gap-2 mt-1">
                        <input type="date" id="view-date" onchange="renderAll()" class="bg-blue-600 text-[10px] font-bold uppercase p-1 rounded border-none outline-none">
                    </div>
                </div>
                <button onclick="toggleSummary()" class="bg-blue-500 p-2 rounded-lg shadow-inner active:scale-90">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
                </button>
            </div>
        </header>

        <div class="content-scroll">
            <div class="max-w-xl mx-auto p-4 space-y-4 pb-28">
                
                <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                    <div class="grid grid-cols-1 gap-2">
                        <div class="flex gap-2">
                            <input type="date" id="input-date" class="w-1/3 px-3 py-3 bg-slate-100 rounded-xl text-xs font-bold outline-none border-2 border-transparent focus:border-blue-500">
                            <input type="text" id="address-input" list="client-suggestions" placeholder="Dirección" 
                                   class="w-2/3 px-4 py-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500"
                                   oninput="checkDirectory(this.value)">
                        </div>
                        <datalist id="client-suggestions"></datalist>
                        
                        <div class="flex gap-2">
                            <input type="text" id="name-input" placeholder="Nombre" class="w-1/2 px-4 py-3 bg-slate-100 rounded-xl text-sm outline-none">
                            <input type="tel" id="phone-input" placeholder="WhatsApp" class="w-1/2 px-4 py-3 bg-slate-100 rounded-xl text-sm outline-none">
                        </div>

                        <div class="flex gap-2 bg-blue-50 p-2 rounded-xl text-center">
                            <div class="flex-1">
                                <label class="text-[9px] font-bold text-blue-700 uppercase">Yogur</label>
                                <input type="number" id="qty-yogur" value="0" class="w-full bg-transparent font-bold text-blue-900 outline-none text-center">
                            </div>
                            <div class="flex-1 border-l border-blue-200">
                                <label class="text-[9px] font-bold text-blue-700 uppercase">Granola</label>
                                <input type="number" id="qty-granola" value="0" class="w-full bg-transparent font-bold text-blue-900 outline-none text-center">
                            </div>
                        </div>

                        <textarea id="notes-input" placeholder="Notas del pedido..." class="w-full px-4 py-2 bg-slate-100 rounded-xl text-xs outline-none h-14"></textarea>
                    </div>

                    <button onclick="searchAndAdd()" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-bold shadow-lg active:scale-95 transition-transform">
                        GUARDAR EN AGENDA
                    </button>
                    
                    <div class="flex gap-2">
                        <button onclick="setSearchAsOrigin()" class="flex-1 bg-slate-100 text-slate-500 py-2 rounded-lg text-[10px] font-bold uppercase">Setear Inicio</button>
                        <button onclick="optimizeRoute()" class="flex-1 bg-green-600 text-white py-2 rounded-lg text-[10px] font-bold uppercase shadow-md">Optimizar Día</button>
                    </div>
                </div>

                <div id="summary-panel" class="hidden bg-slate-900 text-white p-5 rounded-3xl animate-fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-sm uppercase tracking-widest text-blue-400">Carga para el día</h3>
                        <button onclick="toggleSummary()" class="text-slate-400">✕</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700">
                            <p id="total-yogur" class="text-2xl font-black text-blue-400">0</p>
                            <p class="text-[10px] opacity-60 uppercase font-bold tracking-tighter">Yogures</p>
                        </div>
                        <div class="bg-slate-800 p-3 rounded-2xl border border-slate-700">
                            <p id="total-granola" class="text-2xl font-black text-green-400">0</p>
                            <p class="text-[10px] opacity-60 uppercase font-bold tracking-tighter">Granolas</p>
                        </div>
                    </div>
                </div>

                <div id="map" class="shadow-md border-4 border-white"></div>

                <button onclick="openInGoogleMaps()" id="gps-button" class="hidden w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl flex items-center justify-center gap-3 animate-fade-in">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2 6.3-6.4 2.1 2-6.3z"/></svg>
                    ABRIR RUTA EN GPS
                </button>

                <div class="space-y-3">
                    <div class="flex justify-between items-center px-2">
                        <h2 class="font-bold text-slate-800 text-sm uppercase">Pendientes (<span id="count-pending">0</span>)</h2>
                        <button onclick="clearEverything()" class="text-[10px] text-red-500 font-bold uppercase tracking-widest">Limpiar</button>
                    </div>
                    <ul id="pending-list" class="space-y-3"></ul>
                </div>

                <div id="completed-section" class="hidden space-y-3 pt-4 border-t border-slate-200">
                    <h2 class="font-bold text-slate-400 text-sm uppercase px-2">Entregado hoy</h2>
                    <ul id="completed-list" class="space-y-2 opacity-60"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CITY_SUFFIX = ", Junín, Buenos Aires, Argentina";
        let map, originMarker, routeLine;
        
        // Estructura de datos: Array de objetos con propiedad .date
        let stops = JSON.parse(localStorage.getItem('stops_v4')) || [];
        let completed = JSON.parse(localStorage.getItem('completed_v4')) || [];
        let directory = JSON.parse(localStorage.getItem('directory_v4')) || {};
        let origin = JSON.parse(localStorage.getItem('origin_v4')) || null;

        function initMap() {
            // Setea fecha de hoy por defecto
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('view-date').value = hoy;
            document.getElementById('input-date').value = hoy;

            map = L.map('map', { zoomControl: false }).setView([-34.585, -60.948], 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            
            updateDirectoryUI();
            renderAll();
        }

        function checkDirectory(addr) {
            if (directory[addr]) {
                document.getElementById('name-input').value = directory[addr].name || "";
                document.getElementById('phone-input').value = directory[addr].phone || "";
                document.getElementById('notes-input').value = directory[addr].notes || "";
            }
        }

        function updateDirectoryUI() {
            const dl = document.getElementById('client-suggestions');
            dl.innerHTML = '';
            Object.keys(directory).forEach(a => {
                const o = document.createElement('option');
                o.value = a;
                dl.appendChild(o);
            });
        }

        async function searchAndAdd(asOrigin = false) {
            const addr = document.getElementById('address-input').value;
            const date = document.getElementById('input-date').value;
            if (!addr || !date) { alert("Falta dirección o fecha"); return; }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr + CITY_SUFFIX)}&limit=1`);
                const data = await res.json();
                if (data[0]) {
                    const latlng = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                    
                    if (asOrigin) {
                        origin = latlng;
                        localStorage.setItem('origin_v4', JSON.stringify(origin));
                    } else {
                        const name = document.getElementById('name-input').value;
                        const phone = document.getElementById('phone-input').value;
                        const y = parseInt(document.getElementById('qty-yogur').value) || 0;
                        const g = parseInt(document.getElementById('qty-granola').value) || 0;
                        const notes = document.getElementById('notes-input').value;

                        directory[addr] = { name, phone, notes };
                        localStorage.setItem('directory_v4', JSON.stringify(directory));
                        
                        stops.push({ id: Date.now(), latlng, addr, name, phone, yogur: y, granola: g, notes, date });
                        saveStops();
                    }
                    renderAll();
                    resetInputs();
                }
            } catch (e) { alert("Error de red"); }
        }

        function renderAll() {
            const currentViewDate = document.getElementById('view-date').value;

            // Limpieza
            if (originMarker) map.removeLayer(originMarker);
            if (routeLine) map.removeLayer(routeLine);
            map.eachLayer(l => { if(l instanceof L.Marker) map.removeLayer(l); });

            // Origen (Global)
            if (origin) {
                const icon = L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png', iconSize: [25, 41], iconAnchor: [12, 41] });
                originMarker = L.marker(origin, {icon}).addTo(map);
            }

            // Filtrar stops por la fecha seleccionada en el header
            const visibleStops = stops.filter(s => s.date === currentViewDate);
            const visibleCompleted = completed.filter(s => s.date === currentViewDate);

            visibleStops.forEach(s => L.marker(s.latlng).addTo(map));

            // UI de Listas
            const pList = document.getElementById('pending-list');
            const cList = document.getElementById('completed-list');
            pList.innerHTML = ''; cList.innerHTML = '';

            document.getElementById('count-pending').innerText = visibleStops.length;
            document.getElementById('completed-section').classList.toggle('hidden', visibleCompleted.length === 0);

            visibleStops.forEach(s => {
                const li = document.createElement('li');
                li.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 animate-fade-in";
                li.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div class="overflow-hidden">
                            <p class="text-[10px] font-black uppercase text-blue-700 truncate">${s.name || 'Cliente'}</p>
                            <p class="text-[9px] text-slate-500 truncate">${s.addr}</p>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="sendWhatsApp('${s.phone}', '${s.name}', '${s.addr}')" class="p-2 bg-green-100 text-green-700 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                            </button>
                            <button onclick="deliver(${s.id})" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-[9px] font-bold">ENTREGADO</button>
                        </div>
                    </div>
                    <div class="flex gap-2 text-[9px] font-bold">
                        <span class="bg-blue-50 text-blue-800 px-2 py-1 rounded">🥛 ${s.yogur}</span>
                        <span class="bg-green-50 text-green-800 px-2 py-1 rounded">🌾 ${s.granola}</span>
                        ${s.notes ? `<span class="bg-amber-50 text-amber-800 px-2 py-1 rounded italic truncate">📝 ${s.notes}</span>` : ''}
                    </div>
                `;
                pList.appendChild(li);
            });

            visibleCompleted.forEach(s => {
                const li = document.createElement('li');
                li.className = "bg-slate-200 p-2 rounded-xl flex justify-between items-center text-[10px]";
                li.innerHTML = `<span>${s.name} - ${s.addr}</span> <span class="font-bold">✓</span>`;
                cList.appendChild(li);
            });

            // GPS y Ruta
            if (origin && visibleStops.length > 0) {
                const pts = [[origin.lat, origin.lng], ...visibleStops.map(s => [s.latlng.lat, s.latlng.lng])];
                routeLine = L.polyline(pts, {color: '#2563eb', weight: 3, dashArray: '5, 10'}).addTo(map);
                document.getElementById('gps-button').classList.remove('hidden');
            } else {
                document.getElementById('gps-button').classList.add('hidden');
            }

            // Totales de carga para ese día
            let ty = 0, tg = 0;
            visibleStops.forEach(s => { ty += s.yogur; tg += s.granola; });
            document.getElementById('total-yogur').innerText = ty;
            document.getElementById('total-granola').innerText = tg;
        }

        function deliver(id) {
            const idx = stops.findIndex(s => s.id === id);
            completed.push(stops[idx]);
            stops.splice(idx, 1);
            saveStops();
            renderAll();
        }

        function optimizeRoute() {
            const currentViewDate = document.getElementById('view-date').value;
            if(!origin || stops.length < 1) return;

            let dayStops = stops.filter(s => s.date === currentViewDate);
            let otherStops = stops.filter(s => s.date !== currentViewDate);
            
            let ordered = [], current = origin;
            while(dayStops.length > 0) {
                let nearIdx = 0, minDist = Infinity;
                dayStops.forEach((s, i) => {
                    const d = Math.hypot(current.lat - s.latlng.lat, current.lng - s.latlng.lng);
                    if(d < minDist) { minDist = d; nearIdx = i; }
                });
                ordered.push(dayStops[nearIdx]);
                current = dayStops[nearIdx].latlng;
                dayStops.splice(nearIdx, 1);
            }
            
            stops = [...ordered, ...otherStops];
            saveStops();
            renderAll();
        }

        function openInGoogleMaps() {
            const currentViewDate = document.getElementById('view-date').value;
            const visibleStops = stops.filter(s => s.date === currentViewDate);
            if(!origin || visibleStops.length === 0) return;

            const originStr = `${origin.lat},${origin.lng}`;
            const destStr = `${visibleStops[visibleStops.length-1].latlng.lat},${visibleStops[visibleStops.length-1].latlng.lng}`;
            const waypoints = visibleStops.slice(0, -1).map(s => `${s.latlng.lat},${s.latlng.lng}`).join('|');
            
            window.open(`https://www.google.com/maps/dir/?api=1&origin=${originStr}&destination=${destStr}&waypoints=${waypoints}&travelmode=driving`, '_blank');
        }

        function sendWhatsApp(phone, name, addr) {
            const msg = `¡Hola ${name}! Claudio de Yogur Griego Junín. Estoy saliendo para tu casa en ${addr}. Llego en unos minutos.`;
            const final = phone.replace(/\D/g, '').length <= 10 ? '549' + phone.replace(/\D/g, '') : phone.replace(/\D/g, '');
            window.open(`https://wa.me/${final}?text=${encodeURIComponent(msg)}`);
        }

        function saveStops() { 
            localStorage.setItem('stops_v4', JSON.stringify(stops));
            localStorage.setItem('completed_v4', JSON.stringify(completed));
        }

        function toggleSummary() { document.getElementById('summary-panel').classList.toggle('hidden'); }
        function setSearchAsOrigin() { searchAndAdd(true); }
        function resetInputs() {
            ['address-input','name-input','phone-input','notes-input'].forEach(i => document.getElementById(i).value = '');
            document.getElementById('qty-yogur').value = 0;
            document.getElementById('qty-granola').value = 0;
        }

        function clearEverything() {
            const currentViewDate = document.getElementById('view-date').value;
            if(confirm(`¿Borrar todos los pedidos del día ${currentViewDate}?`)) {
                stops = stops.filter(s => s.date !== currentViewDate);
                completed = completed.filter(s => s.date !== currentViewDate);
                saveStops();
                renderAll();
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
